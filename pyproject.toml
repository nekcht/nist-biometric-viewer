[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nist-biometric-viewer"
dynamic = ["version"]
description = "Nist Biometric Viewer for structured ANSI/NIST biometric transaction review"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",
    "PySide6>=6.6",
    "openpyxl>=3.1",
    "rarfile>=4.2",
    "wsq>=0.8",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0; sys_platform == 'win32'",
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
nist-biometric-viewer = "nist_fingerprint_comparator.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "nist_fingerprint_comparator.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"resources" = ["resources/nist_comparator.png"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
